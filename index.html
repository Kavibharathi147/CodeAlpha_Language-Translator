<!DOCTYPE html>
<html>
<head>
<title>CodeAlpha - Language Translator</title>
<style>
body{font-family:Arial; background:#f0f2f5; display:flex; justify-content:center; padding:30px}
.box{background:white; padding:25px; border-radius:15px; width:450px; box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center; color:#6a11cb}
textarea{width:100%; height:100px; padding:10px; border-radius:8px; border:1px solid #ccc}
select{width:100%; padding:10px; margin:10px 0; border-radius:8px}
button{width:100%; padding:12px; background:#6a11cb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer}
#output{background:#f9f9f9; padding:15px; border-radius:8px; margin-top:15px; min-height:60px}
</style>
</head>
<body>
<div class="box">
<h2>🌐 Language Translator</h2>
<p>Type Text (English):</p>
<textarea id="inputText" placeholder="Example: Hello, how are you?"></textarea>
<p>Translate To:</p>
<select id="targetLang">
<option value="ta">Tamil</option>
<option value="hi">Hindi</option>
<option value="te">Telugu</option>
<option value="ml">Malayalam</option>
<option value="kn">Kannada</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
</select>
<button onclick="translateText()">Translate</button>
<div id="output">Translation will appear here...</div>
<button onclick="copyText()" style="background:#333; margin-top:10px">Copy Translation</button>
<p style="text-align:center; font-size:12px; color:grey">Made for CodeAlpha AI Internship</p>
</div>
<script>
async function translateText(){
  let text = document.getElementById("inputText").value;
  let lang = document.getElementById("targetLang").value;
  if(!text){ alert("Please type something!"); return; }
  document.getElementById("output").innerText = "Translating...";
  try{
    let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`;
    let res = await fetch(url);
    let data = await res.json();
    document.getElementById("output").innerText = data[0][0][0];
  } catch(e){
    document.getElementById("output").innerText = "Internet check pannu da, net illa!";
  }
}
function copyText(){
  let t = document.getElementById("output").innerText;
  navigator.clipboard.writeText(t);
  alert("Copied!");
}
</script>
</body>
</html>
